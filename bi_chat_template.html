<!DOCTYPE html>
<html lang='fr'>
<head>
<meta charset='utf-8'>
<style>
:root {
  --question-color: #1554c0;
  --question-bg: #e8f0fe;
  --answer-color: #000000;
  --answer-bg: #f3f4f6;
  --info-color: #6b7280;
  --error-color: #b42318;
  --error-bg: #fef3f2;
}
html, body { margin: 0; padding: 0; background: #ffffff; font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 10pt; }
#chat { display: flex; flex-direction: column; gap: 4px; padding: 12px; }
.who { font-size: 8pt; color: var(--info-color); margin-top: 8px; }
.msg { max-width: 80%; padding: 8px 12px; border-radius: 10px; line-height: 1.45; overflow-wrap: anywhere; }
.question { align-self: flex-end; text-align: right; color: var(--question-color); background: var(--question-bg); border-bottom-right-radius: 2px; white-space: pre-wrap; }
.who.question-who { align-self: flex-end; }
.answer { align-self: flex-start; text-align: left; color: var(--answer-color); background: var(--answer-bg); border-bottom-left-radius: 2px; }
.who.answer-who { align-self: flex-start; }
.error { align-self: flex-start; color: var(--error-color); background: var(--error-bg); }
.info { align-self: center; color: var(--info-color); font-style: italic; font-size: 9pt; }
.answer p { margin: 0 0 6px 0; }
.answer p:last-child { margin-bottom: 0; }
.answer h3, .answer h4, .answer h5, .answer h6 { margin: 8px 0 4px 0; font-size: 10.5pt; }
.answer ul, .answer ol { margin: 2px 0 6px 0; padding-left: 22px; }
.answer table { border-collapse: collapse; margin: 6px 0; background: #ffffff; }
.answer th, .answer td { border: 1px solid #d1d5db; padding: 3px 8px; }
.answer th { background: #e5e7eb; text-align: left; }
.answer td.num { text-align: right; font-variant-numeric: tabular-nums; }
.answer code { font-family: Consolas, monospace; background: #e5e7eb; padding: 0 3px; border-radius: 3px; }
.answer pre { font-family: Consolas, monospace; background: #e5e7eb; padding: 6px; border-radius: 4px; overflow-x: auto; }
.pending span { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: var(--info-color); animation: blink 1.2s infinite; }
.pending span:nth-child(2) { animation-delay: 0.2s; }
.pending span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
.empty { color: var(--info-color); text-align: center; margin-top: 40px; }
</style>
</head>
<body>
<div id='chat'></div>
<script>
var DATA = /*BI_DATA*/null;

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function inline(s) {
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  return s;
}

function cells(row) {
  row = row.replace(/^\|/, '').replace(/\|$/, '');
  return row.split('|').map(function (c) { return c.trim(); });
}

function isNumber(c) {
  return /^[-+]?[\d\s  ]+([.,]\d+)?\s?(%|€)?$/.test(c);
}

function table(rows) {
  var html = '<table>';
  var start = 0;
  if (rows.length > 1 && /^\|?[\s:|-]+\|?$/.test(rows[1]) && rows[1].indexOf('-') >= 0) {
    html += '<thead><tr>' + cells(rows[0]).map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') + '</tr></thead>';
    start = 2;
  }
  html += '<tbody>';
  for (var i = start; i < rows.length; i++) {
    html += '<tr>' + cells(rows[i]).map(function (c) {
      return '<td' + (isNumber(c) ? ' class=' + String.fromCharCode(39) + 'num' + String.fromCharCode(39) : '') + '>' + inline(c) + '</td>';
    }).join('') + '</tr>';
  }
  return html + '</tbody></table>';
}

function markdown(src) {
  var lines = esc(src.replace(/\r\n/g, '\n')).split('\n');
  var out = [];
  var para = [];
  var i = 0;
  function flush() {
    if (para.length) { out.push('<p>' + inline(para.join('<br>')) + '</p>'); para = []; }
  }
  while (i < lines.length) {
    var t = lines[i].trim();
    var m;
    if (t === '') { flush(); i++; continue; }
    if (t.indexOf('```') === 0) {
      flush();
      var code = [];
      i++;
      while (i < lines.length && lines[i].trim().indexOf('```') !== 0) { code.push(lines[i]); i++; }
      i++;
      out.push('<pre>' + code.join('\n') + '</pre>');
      continue;
    }
    m = t.match(/^(#{1,6})\s+(.*)$/);
    if (m) {
      flush();
      var n = Math.min(m[1].length + 2, 6);
      out.push('<h' + n + '>' + inline(m[2]) + '</h' + n + '>');
      i++;
      continue;
    }
    if (t.charAt(0) === '|') {
      flush();
      var rows = [];
      while (i < lines.length && lines[i].trim().charAt(0) === '|') { rows.push(lines[i].trim()); i++; }
      out.push(table(rows));
      continue;
    }
    if (/^[-*+]\s+/.test(t)) {
      flush();
      var items = [];
      while (i < lines.length && /^[-*+]\s+/.test(lines[i].trim())) {
        items.push('<li>' + inline(lines[i].trim().replace(/^[-*+]\s+/, '')) + '</li>');
        i++;
      }
      out.push('<ul>' + items.join('') + '</ul>');
      continue;
    }
    if (/^\d+[.)]\s+/.test(t)) {
      flush();
      var oitems = [];
      while (i < lines.length && /^\d+[.)]\s+/.test(lines[i].trim())) {
        oitems.push('<li>' + inline(lines[i].trim().replace(/^\d+[.)]\s+/, '')) + '</li>');
        i++;
      }
      out.push('<ol>' + oitems.join('') + '</ol>');
      continue;
    }
    para.push(t);
    i++;
  }
  flush();
  return out.join('');
}

function bubble(cls, html) {
  var d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = html;
  return d;
}

function label(cls, text) {
  var d = document.createElement('div');
  d.className = 'who ' + cls;
  d.textContent = text;
  return d;
}

function render() {
  var chat = document.getElementById('chat');
  var data = DATA || { pending: false, messages: [] };
  var msgs = data.messages || [];
  if (msgs.length === 0 && !data.pending) {
    chat.innerHTML = '<div class=' + String.fromCharCode(39) + 'empty' + String.fromCharCode(39) + '>Posez une question sur les données du cabinet.</div>';
    return;
  }
  for (var i = 0; i < msgs.length; i++) {
    var role = msgs[i].role;
    var text = msgs[i].text || '';
    if (role === 'user') {
      chat.appendChild(label('question-who', 'Vous'));
      chat.appendChild(bubble('question', esc(text)));
    } else if (role === 'assistant') {
      chat.appendChild(label('answer-who', 'Assistant'));
      chat.appendChild(bubble('answer', markdown(text)));
    } else if (role === 'error') {
      chat.appendChild(bubble('error', esc(text)));
    } else {
      chat.appendChild(bubble('info', esc(text)));
    }
  }
  if (data.pending) {
    chat.appendChild(label('answer-who', 'Assistant'));
    chat.appendChild(bubble('answer pending', '<span></span><span></span><span></span>'));
  }
  window.scrollTo(0, document.body.scrollHeight);
}

render();
</script>
</body>
</html>
